<style>
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background-color: rgba(10, 10, 21, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #00f3ff;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Orbitron', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .navbar-logo {
    font-size: 1.4rem;
    font-weight: 900;
    color: #00f3ff;
    text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
    text-decoration: none;
  }
  .navbar-links {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }
  .navbar-links a {
    color: #ccc;
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    transition: color 0.2s, text-shadow 0.2s, transform 0.2s;
    transform-style: preserve-3d;
  }
  .navbar-links a:hover {
    color: #00f3ff;
    text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
    transform: perspective(400px) translateZ(8px);
  }
  .navbar-links .logout-link {
    color: #ff6b9d;
  }
  .navbar-links .logout-link:hover {
    color: #ff00ff;
    text-shadow: 0 0 10px #ff00ff;
  }
  .navbar-links .admin-link {
    color: #ffd700;
  }
  .navbar-links .admin-link:hover {
    color: #ffaa00;
    text-shadow: 0 0 10px #ffaa00;
  }
</style>

<nav class="navbar">
  <a href="{{ url_for('index') }}" class="navbar-logo">🚀 PoseGuard</a>
  <div class="navbar-links">
    {% if session.get('user') %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('video_upload') }}">📹 Video Analysis</a>
      <a href="{{ url_for('view_records') }}">📁 Incident Records</a>
    {% endif %}
    {% if session.get('admin') %}
      <a href="{{ url_for('reports') }}">Reports</a>
      <a href="{{ url_for('admin_portal') }}" class="admin-link">Admin Portal</a>
    {% endif %}
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('information') }}">Information</a>
    {% if session.get('user') %}
      <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
    {% endif %}
  </div>
</nav>
