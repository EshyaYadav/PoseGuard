{% extends 'base.html' %}
{% block title %}Login — PoseGuard{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
  <div class="glass-card w-full max-w-md">
    <h2 class="text-center text-2xl font-orbitron neon-text mb-8" style="font-family:'Orbitron',sans-serif;color:#00f3ff;text-shadow:0 0 10px #00f3ff;">Login</h2>
    {% if error %}
    <div style="background:rgba(255,0,0,0.15);border:1px solid #ff4444;border-radius:8px;padding:12px 16px;color:#ff6666;margin-bottom:16px;font-size:0.9rem;">
      {{ error }}
    </div>
    {% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-4">
        <label style="display:block;margin-bottom:6px;color:#aaa;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Username or Email</label>
        <input class="input-field" type="text" name="identifier" placeholder="Enter your username or email" required />
      </div>
      <div class="mb-6">
        <label style="display:block;margin-bottom:6px;color:#aaa;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Password</label>
        <input class="input-field" type="password" name="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn-primary w-full" style="width:100%;">Login</button>
    </form>
    <p style="text-align:center;margin-top:20px;color:#aaa;font-size:0.9rem;">
      Don't have an account? <a href="{{ url_for('signup') }}" style="color:#00f3ff;text-decoration:none;">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
