{% extends 'base.html' %}
{% block title %}Sign Up — PoseGuard{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
  <div class="glass-card w-full max-w-md">
    <h2 class="text-center text-2xl mb-8" style="font-family:'Orbitron',sans-serif;color:#00f3ff;text-shadow:0 0 10px #00f3ff;">Create Account</h2>
    {% if error %}
    <div style="background:rgba(255,0,0,0.15);border:1px solid #ff4444;border-radius:8px;padding:12px 16px;color:#ff6666;margin-bottom:16px;font-size:0.9rem;">
      {{ error }}
    </div>
    {% endif %}
    <form method="POST" action="{{ url_for('signup') }}">
      <div class="mb-4">
        <label style="display:block;margin-bottom:6px;color:#aaa;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Full Name</label>
        <input class="input-field" type="text" name="name" placeholder="Enter your full name" required />
      </div>
      <div class="mb-4">
        <label style="display:block;margin-bottom:6px;color:#aaa;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Username</label>
        <input class="input-field" type="text" name="username" placeholder="Choose a username" required />
      </div>
      <div class="mb-4">
        <label style="display:block;margin-bottom:6px;color:#aaa;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Email</label>
        <input class="input-field" type="email" name="email" placeholder="Enter your email" required />
      </div>
      <div class="mb-6">
        <label style="display:block;margin-bottom:6px;color:#aaa;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Password</label>
        <input class="input-field" type="password" name="password" placeholder="Choose a password" required />
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Create Account</button>
    </form>
    <p style="text-align:center;margin-top:20px;color:#aaa;font-size:0.9rem;">
      Already have an account? <a href="{{ url_for('login') }}" style="color:#00f3ff;text-decoration:none;">Login</a>
    </p>
    <p style="text-align:center;margin-top:8px;color:rgba(255,255,255,0.3);font-size:0.78rem;">
      Use an <strong>@poseguard.com</strong> email for admin access.
    </p>
  </div>
</div>
{% endblock %}
